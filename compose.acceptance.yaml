services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tms_s411_acceptance
      POSTGRES_USER: tms_acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_POSTGRES_PASSWORD:?Set ACCEPTANCE_POSTGRES_PASSWORD}
    ports:
      - "55432:5432"
    volumes:
      - sprint411_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms_acceptance -d tms_s411_acceptance"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://+:8080
      AcceptanceEnvironment__Enabled: "true"
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=tms_s411_acceptance;Username=tms_acceptance;Password=${ACCEPTANCE_POSTGRES_PASSWORD}
      Jwt__SigningKey: ${ACCEPTANCE_JWT_SIGNING_KEY:?Set ACCEPTANCE_JWT_SIGNING_KEY}
      DevelopmentSeed__Enabled: "true"
      DevelopmentSeed__OwnerEmail: owner@sprint411.local
      DevelopmentSeed__OwnerPassword: ${ACCEPTANCE_OWNER_PASSWORD:?Set ACCEPTANCE_OWNER_PASSWORD}
      DevelopmentSeed__CompanyName: Sprint 4.1.1 Disposable Acceptance
      DevelopmentSeed__CompanySlug: sprint-411-acceptance
      Tracking__Provider: Simulator
      Tracking__SimulatorEnabled: "true"
      Tracking__PollingIntervalSeconds: "2"
      Tracking__OfflineThresholdSeconds: "30"
      Tracking__SimulatorHeartbeatSeconds: "10"
      Routing__Provider: Deterministic
      TruckPhotos__RootPath: /data/truck-photos
      Cors__AllowedOrigins__0: http://localhost:3100
    ports:
      - "5180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sprint411_photo_data:/data/truck-photos
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sprint411_postgres_data:
  sprint411_photo_data:
