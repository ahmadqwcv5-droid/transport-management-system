services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transport_management}
      POSTGRES_USER: ${POSTGRES_USER:-transport_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ stores clusters below a major-version directory so that
      # in-place upgrades can use pg_upgrade without crossing mount boundaries.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-transport_management};Username=${POSTGRES_USER:-transport_app};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      DevelopmentSeed__Enabled: "true"
      DevelopmentSeed__OwnerPassword: ${DEMO_OWNER_PASSWORD:?Set DEMO_OWNER_PASSWORD in .env}
      Tracking__Provider: ${TRACKING_PROVIDER:-Simulator}
      Tracking__SimulatorEnabled: ${TRACKING_SIMULATOR_ENABLED:-true}
      Tracking__PollingIntervalSeconds: ${TRACKING_POLLING_INTERVAL_SECONDS:-2}
      Tracking__SimulatorTickSeconds: ${TRACKING_SIMULATOR_TICK_SECONDS:-2}
      Tracking__OfflineThresholdSeconds: ${TRACKING_OFFLINE_THRESHOLD_SECONDS:-30}
      Tracking__HistoryHeartbeatSeconds: ${TRACKING_HISTORY_HEARTBEAT_SECONDS:-300}
      Tracking__SimulatorHeartbeatSeconds: ${TRACKING_SIMULATOR_HEARTBEAT_SECONDS:-8}
      Tracking__TrailGapThresholdSeconds: ${TRACKING_TRAIL_GAP_THRESHOLD_SECONDS:-300}
      Tracking__TrailJumpThresholdMeters: ${TRACKING_TRAIL_JUMP_THRESHOLD_METERS:-5000}
      Tracking__MaxTripHistoryPoints: ${TRACKING_MAX_TRIP_HISTORY_POINTS:-500}
      Tracking__SimulatorSpeedKilometersPerHour: ${TRACKING_SIMULATOR_SPEED_KMH:-65}
      Tracking__SimulatorStepDistanceMeters: ${TRACKING_SIMULATOR_STEP_DISTANCE_METERS:-1000}
      Dispatch__MaximumPositionAgeSeconds: ${DISPATCH_MAXIMUM_POSITION_AGE_SECONDS:-300}
      Geofence__MinimumSamples: ${GEOFENCE_MINIMUM_SAMPLES:-2}
      Geofence__MinimumDwellSeconds: ${GEOFENCE_MINIMUM_DWELL_SECONDS:-8}
      Routing__Provider: ${ROUTING_PROVIDER:-Osrm}
      Routing__BaseUrl: ${ROUTING_BASE_URL:-https://router.project-osrm.org}
      Routing__UserAgent: ${ROUTING_USER_AGENT:-TransportManagementDevelopment/0.1}
      Routing__TimeoutSeconds: ${ROUTING_TIMEOUT_SECONDS:-20}
      Routing__OffRouteThresholdMeters: ${ROUTING_OFF_ROUTE_THRESHOLD_METERS:-150}
      Routing__ArrivalThresholdMeters: ${ROUTING_ARRIVAL_THRESHOLD_METERS:-30}
      Geocoding__Provider: ${GEOCODING_PROVIDER:-}
      Geocoding__BaseUrl: ${GEOCODING_BASE_URL:-}
      Geocoding__UserAgent: ${GEOCODING_USER_AGENT:-TransportManagement-Development}
      TruckPhotos__RootPath: /data/truck-photos
      TruckPhotos__MaximumBytes: ${TRUCK_PHOTO_MAXIMUM_BYTES:-5242880}
      TruckPhotos__MaximumPixels: ${TRUCK_PHOTO_MAXIMUM_PIXELS:-40000000}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - truck_photo_data:/data/truck-photos
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  truck_photo_data:
